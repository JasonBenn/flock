{% load static %}
<link rel="shortcut icon" type="image/png" href="{% static 'favicon.ico' %}"/>
<link rel="stylesheet" type="text/css" href="{% static 'styles.css' %}">
<title>Flock</title>

<h1>Flock</h1>
<div class="container">
    {% for location, people in people_by_location.items %}
        <div id='loc_{{location.snake_case_name}}' class='locationPanel'>
            <div class="locationHolder">
                <p class='locationName'>{{location.name}}</p>
                <div class='{{location.camel_case_name}}Icon'></div>
            </div>
            {% for person in people %}
                <p>{{ person }}</p>
            {% endfor %}
        </div>
    {% endfor %}
</div>
