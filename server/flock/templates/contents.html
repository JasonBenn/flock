{% load template_utils %}
{% if location_to_people %}
{% else %}
  <div>
    <p>no one's here, come hang!</p>
  </div>
{% endif %}
{% for location, people in location_to_people.items %}
  <a class="locationPanelContainer gray no-underline" href="/report_ground_truth?location_id={{ location.id }}">
    <div id='loc_{{ location.clean_name|snake_case }}' class='locationPanel'>
      <div class="locationHolder">
        <p class='locationName'>{{ location.name }}</p>
        <div class='{{ location.clean_name|camel_case }}Icon'></div>
      </div>
      <div class="locationBody">
        {% for person in people %}
            <p>{{ person.name }}</p>
        {% endfor %}
      </div>
    </div>
  </a>
{% endfor %}

<div class="bottom">
  <p><a class="gray" href="/report_ground_truth">Report a mistake</a></p>
  <p><a class="gray" href="/admin/flock/device/add/">Add your device(s)</a></p>
</div>
